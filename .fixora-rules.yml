rules:
- id: fixora-wrapper-process-command
  pattern: "def process_command(...):\n  ..."
  message: 'Vulnerable function ''process_command()'' wraps CommandGuard.analyze,
    judge_command, re.search, supabase.table. Vulnerability: Command Injection. User
    input is passed to the ''re.search'' function without proper sanitization, which
    can lead to command injection vulnerabilities.'
  severity: ERROR
  languages:
  - python
  metadata:
    category: security
    technology:
    - python
    source: fixora-ai-analysis
    vulnerability_type: Command Injection
    confidence: HIGH
    wrapper_defined_in: orchestrator.py
    wraps:
    - CommandGuard.analyze
    - judge_command
    - re.search
    - supabase.table
    modules_used:
    - guard
    - database
    - ai_judge
    - re
    cwe: &id001
    - CWE-78
    owasp: &id002
    - A03:2021
- id: fixora-wrapper-analyze
  pattern: "def analyze(...):\n  ..."
  message: 'Vulnerable function ''analyze()'' wraps shlex.split. Vulnerability: Command
    Injection. The ''shlex.split'' function is used to split the command text, but
    it does not prevent command injection attacks.'
  severity: WARNING
  languages:
  - python
  metadata:
    category: security
    technology:
    - python
    source: fixora-ai-analysis
    vulnerability_type: Command Injection
    confidence: MEDIUM
    wrapper_defined_in: guard.py
    wraps:
    - shlex.split
    modules_used:
    - shlex
    cwe: *id001
    owasp: *id002
- id: fixora-wrapper-judge-command
  pattern: "def judge_command(...):\n  ..."
  message: 'Vulnerable function ''judge_command()'' wraps genai.GenerativeModel, json.loads,
    asyncio.to_thread. Vulnerability: Command Injection. The ''judge_command'' function
    uses the ''genai.GenerativeModel'' to analyze the command text, but it does not
    prevent command injection attacks.'
  severity: WARNING
  languages:
  - python
  metadata:
    category: security
    technology:
    - python
    source: fixora-ai-analysis
    vulnerability_type: Command Injection
    confidence: MEDIUM
    wrapper_defined_in: ai_judge.py
    wraps:
    - genai.GenerativeModel
    - json.loads
    - asyncio.to_thread
    modules_used:
    - json
    - asyncio
    - google
    cwe: *id001
    owasp: *id002
